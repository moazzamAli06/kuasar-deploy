apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-sandbox
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate-sandbox
        app.kubernetes.io/part-of: kuasar
        kuasar.ai/db: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: dockerhub-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: migrate
        image: docker.io/moazzamali06/kuasar-sandbox:replace
        args: ["--migrate"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        envFrom:
        - configMapRef:
            name: kuasar-common
        # ONLY this Job holds the database owner login; the running service never sees it.
        - secretRef:
            name: kuasar-sandbox-migrate
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: tmp, emptyDir: {}}
