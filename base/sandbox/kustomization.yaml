apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
- migrate-job.yaml
configMapGenerator:
- name: kuasar-sandbox
  literals:
    - Sandbox__AllowProjectDockerfiles=false
    - Sandbox__PreviewEmbedOrigins__2=https://webapp.kuasarai.com
    - Sandbox__PreviewPort=8090
    - Sandbox__PreviewScheme=http
