# Doors FROM the sandbox host INTO the cluster. The host needs these and nothing else: project (source archives, environment, thumbnails),
# organization (membership), billing (settle), RabbitMQ (events). NodePorts are reachable only from the cloud VPC (cloud firewall) and, inside
# the cluster, only from the host's network (policy sandbox-host-ingress).
---
apiVersion: v1
kind: Service
metadata:
  name: bridge-project
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: project
  ports:
  - {name: tcp, port: 8080, targetPort: 8080, nodePort: 30101}
---
apiVersion: v1
kind: Service
metadata:
  name: bridge-organization
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: organization
  ports:
  - {name: tcp, port: 8080, targetPort: 8080, nodePort: 30102}
---
apiVersion: v1
kind: Service
metadata:
  name: bridge-billing
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: billing
  ports:
  - {name: tcp, port: 8080, targetPort: 8080, nodePort: 30103}
---
apiVersion: v1
kind: Service
metadata:
  name: bridge-rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
  - {name: tcp, port: 5672, targetPort: 5672, nodePort: 30672}
