apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/part-of: kuasar
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: dockerhub-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: platform
      containers:
      - name: platform
        image: docker.io/moazzamali06/kuasar-platform:replace
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        envFrom:
        - configMapRef:
            name: kuasar-common
        - secretRef:
            name: kuasar-shared
        - configMapRef:
            name: kuasar-platform
        - secretRef:
            name: kuasar-platform
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        startupProbe:
          httpGet: {path: /health/live, port: http}
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet: {path: /health/live, port: http}
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet: {path: /health/ready, port: http}
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: tmp, emptyDir: {}}
