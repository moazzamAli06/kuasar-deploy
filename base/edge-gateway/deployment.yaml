apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/part-of: kuasar
        kuasar.ai/edge-only: true
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: dockerhub-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: edge-gateway
      containers:
      - name: edge-gateway
        image: docker.io/moazzamali06/kuasar-edge-gateway:replace
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        startupProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: access, mountPath: /etc/nginx/access.conf, subPath: access.conf, readOnly: true}
      volumes:
      - {name: tmp, emptyDir: {}}
      - {name: access, configMap: {name: edge-access}}
