# Which callers may tell this gateway who the visitor is (via the CF-Connecting-IP header that Cloudflare sets).
# Kubernetes: only the pod network (cloudflared runs there).
# Included at http level from nginx.conf. A caller NOT listed here cannot choose the address we record.
geo $from_trusted_proxy {
  default 0;
  127.0.0.0/8 1;
  10.244.0.0/16 1;   # DOKS and kind pod network: keep as narrow as the cluster allows
  ::1/128 1;
}
