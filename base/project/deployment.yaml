apiVersion: apps/v1
kind: Deployment
metadata:
  name: project
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: project
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project
        app.kubernetes.io/part-of: kuasar
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: dockerhub-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: project
      containers:
      - name: project
        image: docker.io/moazzamali06/kuasar-project:replace
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        envFrom:
        - configMapRef:
            name: kuasar-common
        - secretRef:
            name: kuasar-shared
        - configMapRef:
            name: kuasar-project
        - secretRef:
            name: kuasar-project
        env:
        - name: Templates__Path
          value: "/app/templates"
        - name: Storage__Root
          value: "/data/repos"
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: 1, memory: 1Gi}
        startupProbe:
          httpGet: {path: /health/live, port: http}
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet: {path: /health/live, port: http}
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet: {path: /health/ready, port: http}
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: repos, mountPath: /data/repos}
      volumes:
      - {name: tmp, emptyDir: {}}
      - {name: repos, persistentVolumeClaim: {claimName: repos}}
