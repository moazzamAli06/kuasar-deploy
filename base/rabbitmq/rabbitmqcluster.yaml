apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq          # the Service is called "rabbitmq" - config/shared.settings.json expects that host name
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
  persistence:
    # storageClassName: unset = the cluster default class; each overlay/cloud sets it (see docs/clouds)
    storage: 10Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  rabbitmq:
    additionalConfig: |
      disk_free_limit.absolute = 1GB
      vm_memory_high_watermark.relative = 0.6
  override:
    statefulSet:
      spec:
        template:
          metadata:
            labels:
              kuasar.ai/exposure: internal
