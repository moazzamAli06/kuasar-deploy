apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- common/
- identity/
- organization/
- project/
- audit/
- ai/
- sandbox/
- sandbox-host/
- billing/
- platform/
- gateway/
- platform-web/
- marketing-web/
- edge-gateway/
- ai-orchestrator/
- cloudflared/
- rabbitmq/
- network-policies/

# Every pod: marked internal so rabbitmq-operator pods and workloads share the in-namespace rule.
labels:
- pairs: {app.kubernetes.io/part-of: kuasar}
  includeSelectors: false
patches:
- target: {kind: Deployment, name: gateway}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-sandbox
      value: "true"
- target: {kind: Deployment, name: ai}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-sandbox
      value: "true"
- target: {kind: Deployment, name: identity}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1db
      value: "true"
- target: {kind: Deployment, name: organization}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1db
      value: "true"
- target: {kind: Deployment, name: project}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1db
      value: "true"
- target: {kind: Deployment, name: audit}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1db
      value: "true"
- target: {kind: Deployment, name: ai}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1db
      value: "true"
- target: {kind: Deployment, name: billing}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1db
      value: "true"
- target: {kind: Deployment, name: platform}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1db
      value: "true"
- target: {kind: Deployment, name: ai}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-https
      value: "true"
- target: {kind: Deployment, name: project}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-https
      value: "true"
- target: {kind: Deployment, name: identity}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-https
      value: "true"
- target: {kind: Deployment, name: organization}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-https
      value: "true"
- target: {kind: Deployment, name: billing}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-https
      value: "true"
- target: {kind: Deployment, name: platform}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1egress-https
      value: "true"
- target: {kind: Deployment, name: "(identity|organization|project|audit|ai|billing|platform|gateway)"}
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/kuasar.ai~1exposure
      value: internal
