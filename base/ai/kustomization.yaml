apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
- migrate-job.yaml
configMapGenerator:
- name: kuasar-ai
  literals:
    - AI__AllowScriptedProvider=false
    - AI__BlockExternalAi=false
    - AI__LeaseSeconds=900
    - AI__RetentionDays=0
    - AI__Verification__Enabled=true
