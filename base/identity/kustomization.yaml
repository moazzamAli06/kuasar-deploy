apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
- migrate-job.yaml
configMapGenerator:
- name: kuasar-identity
  literals:
    - Auth__External__Google__Enabled=false
    - Auth__External__Microsoft__Enabled=false
    - Auth__External__Microsoft__Tenant=common
    - Email__FromAddress=no-reply@kuasar.ai
    - Email__LogBodies=false
    - Email__Provider=log
    - Sso__AllowPrivateIssuers=false
