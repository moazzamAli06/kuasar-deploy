apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
- migrate-job.yaml
configMapGenerator:
- name: kuasar-organization
  literals:
    - Dev__ReturnInvitationTokens=false
    - Email__FromAddress=no-reply@kuasar.ai
    - Email__LogBodies=false
    - Email__Provider=log
