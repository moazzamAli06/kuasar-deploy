#cloud-config
# Base image for the sandbox execution host: Docker + gVisor (runsc registered as a Docker runtime).
# The application side (compose file, /etc/kuasar/sandbox.env, verification) comes from the kuasarai repository:
#   infrastructure/sandbox-host/install-host.sh, compose.sandbox.yml, tools/verify-sandbox-host.sh   (see docs/SANDBOX-HOST.md)
package_update: true
packages: [ca-certificates, curl, gnupg, ufw]
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - curl -fsSL https://gvisor.dev/archive.gpg | gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" > /etc/apt/sources.list.d/gvisor.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin runsc
  - runsc install
  - systemctl restart docker
  - mkdir -p /etc/kuasar && chmod 700 /etc/kuasar
