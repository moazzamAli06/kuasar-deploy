apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kuasar
  labels:
    release: kube-prometheus-stack   # match your Prometheus ruleSelector
spec:
  groups:
  - name: kuasar.workloads
    rules:
    - alert: KuasarPodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total{namespace=~"kuasar-.*"}[15m]) > 3
      for: 5m
      labels: {severity: warning}
      annotations: {summary: "{{ $labels.namespace }}/{{ $labels.pod }} keeps restarting"}
    - alert: KuasarDeploymentUnavailable
      expr: kube_deployment_status_replicas_available{namespace=~"kuasar-.*"} < kube_deployment_spec_replicas{namespace=~"kuasar-.*"}
      for: 10m
      labels: {severity: critical}
      annotations: {summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has fewer ready replicas than desired"}
    - alert: KuasarMigrationJobFailed
      expr: kube_job_status_failed{namespace=~"kuasar-.*", job_name=~"migrate-.*"} > 0
      for: 1m
      labels: {severity: critical}
      annotations: {summary: "{{ $labels.namespace }}/{{ $labels.job_name }} failed: the release is blocked"}
    - alert: KuasarPodNotReady
      expr: kube_pod_status_ready{namespace=~"kuasar-.*", condition="false"} == 1
      for: 15m
      labels: {severity: warning}
      annotations: {summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready for 15 minutes"}
  - name: kuasar.storage
    rules:
    - alert: KuasarVolumeAlmostFull
      expr: kubelet_volume_stats_available_bytes{namespace=~"kuasar-.*"} / kubelet_volume_stats_capacity_bytes{namespace=~"kuasar-.*"} < 0.15
      for: 10m
      labels: {severity: warning}
      annotations: {summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 15% free"}
