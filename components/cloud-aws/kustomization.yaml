# Cloud component: AWS EKS with RDS/Aurora PostgreSQL. Needs a gp3 StorageClass (EBS CSI driver add-on); EKS only ships gp2 by default
# Use it from an environment overlay:   components: [../../components/cloud-aws]
# Sets only what differs between clouds: the storage class and the managed-database port. Edit the policy "to:" CIDR in the overlay if you can narrow it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The edge gateway trusts the real-visitor-address header only from the pod network; every cloud numbers its pods differently.
configMapGenerator:
- name: edge-access
  behavior: merge
  files:
  - trusted-proxies.conf
patches:
- target: {kind: PersistentVolumeClaim, name: repos}
  patch: |-
    - {op: add, path: /spec/storageClassName, value: gp3}
- target: {kind: RabbitmqCluster, name: rabbitmq}
  patch: |-
    - {op: add, path: /spec/persistence/storageClassName, value: gp3}
- target: {kind: NetworkPolicy, name: db-egress}
  patch: |-
    - {op: replace, path: /spec/egress/0/ports/0/port, value: 5432}
