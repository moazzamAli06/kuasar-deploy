apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 2s, limit_mib: 200, spike_limit_mib: 50}
      batch: {}
    exporters:
      otlphttp:
        endpoint: ${env:OTLP_ENDPOINT}
        headers:
          Authorization: ${env:OTLP_AUTHORIZATION}
    service:
      extensions: [health_check]
      pipelines:
        traces:  {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp]}
        metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp]}
        logs:    {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp]}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: kuasar
        kuasar.ai/egress-https: "true"
        kuasar.ai/exposure: internal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
        args: ["--config=/conf/config.yaml"]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        - {name: health, containerPort: 13133}
        env:
        - name: OTLP_ENDPOINT
          valueFrom: {secretKeyRef: {name: otel-collector, key: OTLP_ENDPOINT}}
        - name: OTLP_AUTHORIZATION
          valueFrom: {secretKeyRef: {name: otel-collector, key: OTLP_AUTHORIZATION}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        livenessProbe:
          httpGet: {path: /, port: health}
          periodSeconds: 15
        readinessProbe:
          httpGet: {path: /, port: health}
          periodSeconds: 10
        volumeMounts:
        - {name: config, mountPath: /conf, readOnly: true}
      volumes:
      - name: config
        configMap: {name: otel-collector-config}
