# Cloud component: local kind cluster (storage class "standard"; the database is the in-cluster Postgres on 5432, so the base port is right).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target: {kind: PersistentVolumeClaim, name: repos}
  patch: |-
    - {op: add, path: /spec/storageClassName, value: standard}
- target: {kind: RabbitmqCluster, name: rabbitmq}
  patch: |-
    - {op: add, path: /spec/persistence/storageClassName, value: standard}
