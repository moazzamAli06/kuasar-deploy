# Cloud component: AKS with Azure Database for PostgreSQL Flexible Server (private access). managed-csi is built into AKS
# Use it from an environment overlay:   components: [../../components/cloud-azure]
# Sets only what differs between clouds: the storage class and the managed-database port. Edit the policy "to:" CIDR in the overlay if you can narrow it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target: {kind: PersistentVolumeClaim, name: repos}
  patch: |-
    - {op: add, path: /spec/storageClassName, value: managed-csi}
- target: {kind: RabbitmqCluster, name: rabbitmq}
  patch: |-
    - {op: add, path: /spec/persistence/storageClassName, value: managed-csi}
- target: {kind: NetworkPolicy, name: db-egress}
  patch: |-
    - {op: replace, path: /spec/egress/0/ports/0/port, value: 5432}
