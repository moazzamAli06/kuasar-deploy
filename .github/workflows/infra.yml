name: infra
on:
  pull_request: { paths: ["infra/**", ".github/workflows/infra.yml"] }
  push: { branches: [main], paths: ["infra/**"] }
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cloud: [digitalocean, aws, gcp, azure]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: "1.10.6" }
      - name: Format
        run: tofu fmt -check -recursive -diff infra/${{ matrix.cloud }}
      - name: Validate
        working-directory: infra/${{ matrix.cloud }}
        run: |
          tofu init -backend=false -input=false
          tofu validate
