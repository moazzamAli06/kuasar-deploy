apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kuasar-staging
resources:
- ../../base
# Sealed secrets for this environment (see docs/SECRETS.md): add each file here once it exists.
- sealed
configMapGenerator:
- name: kuasar-identity
  behavior: merge
  literals:
    - Email__AppBaseUrl=https://staging-webapp.kuasarai.com
    - PublicApp__BaseUrl=https://staging-webapp.kuasarai.com
    - Sso__PublicApiBaseUrl=https://staging-webapp.kuasarai.com
- name: kuasar-organization
  behavior: merge
  literals:
    - Email__AppBaseUrl=https://staging-webapp.kuasarai.com
    - PublicApp__BaseUrl=https://staging-webapp.kuasarai.com
- name: kuasar-sandbox
  behavior: merge
  literals:
    - Sandbox__DockerEndpoint=tcp://sandbox-host.internal:2376
    - Sandbox__PreviewDomain=preview-staging.kuasarai.net
    - Sandbox__PreviewEmbedOrigins__0=https://staging-webapp.kuasarai.com
    - Sandbox__PreviewPort=443
    - Sandbox__PreviewScheme=https
- name: kuasar-billing
  behavior: merge
  literals:
    - Billing__CheckoutCancelUrl=https://staging-webapp.kuasarai.com/app/billing
    - Billing__CheckoutReturnUrl=https://staging-webapp.kuasarai.com/app/billing
    - Billing__PortalReturnUrl=https://staging-webapp.kuasarai.com/app/billing
- name: kuasar-gateway
  behavior: merge
  literals:
    - Cors__Origins=https://staging-webapp.kuasarai.com
patches: []
