apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kuasar-staging
resources:
- ../../base
# Sealed secrets for this environment (see docs/SECRETS.md): add each file here once it exists.
- sealed
configMapGenerator:
- name: kuasar-identity
  behavior: merge
  literals:
    - Email__AppBaseUrl=https://staging-webapp.kuasarai.com
    - PublicApp__BaseUrl=https://staging-webapp.kuasarai.com
    - Sso__PublicApiBaseUrl=https://staging-webapp.kuasarai.com
- name: kuasar-organization
  behavior: merge
  literals:
    - Email__AppBaseUrl=https://staging-webapp.kuasarai.com
    - PublicApp__BaseUrl=https://staging-webapp.kuasarai.com
- name: kuasar-billing
  behavior: merge
  literals:
    - Billing__CheckoutCancelUrl=https://staging-webapp.kuasarai.com/app/billing
    - Billing__CheckoutReturnUrl=https://staging-webapp.kuasarai.com/app/billing
    - Billing__PortalReturnUrl=https://staging-webapp.kuasarai.com/app/billing
- name: kuasar-gateway
  behavior: merge
  literals:
    - Cors__Origins=https://staging-webapp.kuasarai.com
patches:
- target: {kind: EndpointSlice, name: sandbox-host}
  patch: |-
    - {op: replace, path: /endpoints/0/addresses/0, value: "192.0.2.10"}   # TODO: the staging execution host's PRIVATE address
- target: {kind: NetworkPolicy, name: sandbox-host-egress}
  patch: |-
    - {op: replace, path: /spec/egress/0/to/0/ipBlock/cidr, value: "192.0.2.10/32"}
- target: {kind: NetworkPolicy, name: sandbox-host-ingress}
  patch: |-
    - {op: replace, path: /spec/ingress/0/from/0/ipBlock/cidr, value: "10.116.0.0/20"}   # TODO: the VPC range that contains the cluster nodes
