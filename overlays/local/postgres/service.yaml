apiVersion: v1
kind: Service
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
# Reached from the Mac (psql, and the sandbox container running in Docker Desktop) on localhost:30432.
apiVersion: v1
kind: Service
metadata:
  name: postgres-host
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: pg, port: 5432, targetPort: 5432, nodePort: 30432}]
