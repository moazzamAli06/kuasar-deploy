# Stands in for DigitalOcean Managed PostgreSQL. Roles and databases come from the same init-databases.sh the compose stack uses.
# Secret "postgres-init" (created by local/secrets.sh) holds POSTGRES_PASSWORD and the 16 DB_*_PASSWORD values.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: kuasar
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: postgres
        image: postgres:16-alpine
        args: ["-c", "max_connections=200"]
        ports: [{name: pg, containerPort: 5432}]
        env:
        - {name: POSTGRES_USER, value: postgres}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        envFrom:
        - secretRef: {name: postgres-init}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 768Mi}
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "postgres"]}
          periodSeconds: 5
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: run, mountPath: /var/run/postgresql}
        - {name: tmp, mountPath: /tmp}
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
      - {name: run, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      - name: init
        configMap: {name: postgres-init-script, defaultMode: 0755}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: standard
      resources: {requests: {storage: 5Gi}}
