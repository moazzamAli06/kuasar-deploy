- name: kuasar-sandbox
  title_suffix: ' (NOT USED IN THE CLUSTER: these values go in `/etc/kuasar/sandbox.env` on the execution host, see SANDBOX-HOST.md)'
  external: none
  keys:
  - key: ConnectionStrings__Sandbox
    required: 'yes'
    note: ''
  - key: Sandbox__PreviewKey
    required: only if the feature is used
    note: ''
- name: kuasar-sandbox-migrate
  keys:
  - key: ConnectionStrings__Sandbox
    required: 'yes'
    note: database OWNER login, used only by the migrate Job
- name: kuasar-shared
  keys:
  - key: Internal__ServiceKey
    required: 'yes'
    note: ''
  - key: RabbitMq__Username
    required: 'yes'
    note: ''
  - key: RabbitMq__Password
    required: 'yes'
    note: ''
  - key: Jwt__VerificationKeys__0__KeyId
    required: 'yes'
    note: ''
  - key: Jwt__VerificationKeys__0__PublicKeyBase64
    required: 'yes'
    note: ''
  - key: OTEL_EXPORTER_OTLP_HEADERS
    required: only if the feature is used
    note: ''
- name: otel-collector
  title_suffix: ' (only with `components/observability`)'
  external: observability
  keys:
  - key: OTLP_ENDPOINT
    required: 'yes'
    note: base URL of your OTLP/HTTP backend, `https://...`
  - key: OTLP_AUTHORIZATION
    required: 'yes'
    note: full value of the `Authorization` header, for example `Basic ...` or `Bearer ...`
- name: rabbitmq-default-user
  keys:
  - key: username
    required: 'yes'
    note: must equal RabbitMq__Username
  - key: password
    required: 'yes'
    note: must equal RabbitMq__Password; create BEFORE the cluster so the operator uses it
  - key: default_user.conf
    required: local only
    note: two lines, `default_user = <username>` and `default_pass = <password>`. The queue pod mounts this file. `local/secrets.sh` writes it. In the cloud the operator adds it; locally that often never
      happens and the pod stays stuck
footer: |
  ## Local environment (`kuasar-local`)

  Not sealed: `local/secrets.sh` creates these as plain Secrets from `local/.env.local` (generated by `local/make-env.sh`). Same names and keys as above, plus `postgres-init` (the Postgres superuser password and the 16 `DB_<SERVICE>_OWNER/APP_PASSWORD` values read by `init-databases.sh`), and `rabbitmq-default-user`. There is no `cloudflared`, `dockerhub-pull` (images are public) or `kuasar-sandbox` secret locally. The Argo CD repository credential (`repo-kuasar-deploy` in namespace `argocd`) holds the read-only GitHub token you typed at install. Nothing is committed.
