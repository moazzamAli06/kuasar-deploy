# Single source of truth for every Kubernetes Secret an environment needs.
# docs/SECRETS.md and the ExternalSecret manifests are GENERATED from this file: edit here, then run  python3 tools/gen-secrets.py
# CI runs  python3 tools/gen-secrets.py --check  and fails when the generated files are out of date.
# external: base (default: ExternalSecret in components/external-secrets) | observability (components/observability-external-secrets) | none (not a cluster Secret)
header: |+
  # Secrets each environment needs

  > Generated from `secrets/catalog.yaml` by `tools/gen-secrets.py`: edit the catalog, not this file.

  Nothing here goes into Git in plain text. Create each Secret locally, seal it with `tools/seal-secrets.sh`, commit the sealed file under `overlays/<env>/sealed/`, and list it in that folder's `kustomization.yaml`.

  Instead of sealing, you can keep the values in your cloud's secret manager and sync them with the External Secrets Operator (`components/external-secrets`, see [SECURITY.md](SECURITY.md)); the secret and key names below are the same either way.

  Create the namespace's secrets BEFORE the first sync: the migration Jobs and Deployments refuse to start without them.

secrets:
- name: cloudflared
  keys:
  - key: TUNNEL_TOKEN
    required: 'yes'
    note: from the Cloudflare Zero Trust tunnel; hostnames are routed in the Cloudflare dashboard
- name: dockerhub-pull
  keys:
  - key: .dockerconfigjson
    required: 'yes'
    note: type kubernetes.io/dockerconfigjson, read-only Docker Hub token
- name: kuasar-ai
  keys:
  - key: ConnectionStrings__Ai
    required: 'yes'
    note: ''
  - key: AiCredentials__Key
    required: 'yes'
    note: ''
  - key: AI_ECONOMY_API_KEY
    required: only if the feature is used
    note: ''
  - key: AI_STRONG_API_KEY
    required: only if the feature is used
    note: ''
  - key: AI_OPENAI_ECONOMY_API_KEY
    required: only if the feature is used
    note: ''
  - key: AI_OPENAI_STRONG_API_KEY
    required: only if the feature is used
    note: ''
- name: kuasar-ai-migrate
  keys:
  - key: ConnectionStrings__Ai
    required: 'yes'
    note: database OWNER login, used only by the migrate Job
- name: kuasar-ai-orchestrator
  keys:
  - key: INTERNAL_SERVICE_KEY
    required: 'yes'
    note: same value as Internal__ServiceKey in kuasar-shared
- name: kuasar-audit
  keys:
  - key: ConnectionStrings__Audit
    required: 'yes'
    note: ''
  - key: Audit__Export__SigningKey
    required: 'yes'
    note: ''
- name: kuasar-audit-migrate
