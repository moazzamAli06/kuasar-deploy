    required: 'yes'
    note: database OWNER login, used only by the migrate Job
- name: kuasar-billing
  keys:
  - key: ConnectionStrings__Billing
    required: 'yes'
    note: ''
  - key: Billing__WebhookSecret
    required: 'yes'
    note: ''
  - key: Billing__StripeSecretKey
    required: only if the feature is used
    note: ''
- name: kuasar-billing-migrate
  keys:
  - key: ConnectionStrings__Billing
    required: 'yes'
    note: database OWNER login, used only by the migrate Job
- name: kuasar-identity
  keys:
  - key: ConnectionStrings__Identity
    required: 'yes'
    note: ''
  - key: SecretBox__Key
    required: 'yes'
    note: ''
  - key: Platform__AdminEmail
    required: only if the feature is used
    note: first platform operator (still has to enrol MFA)
  - key: Platform__AdminInitialPassword
    required: only if the feature is used
    note: ''
  - key: Jwt__KeyId
    required: 'yes'
    note: ''
  - key: Jwt__PrivateKeyBase64
    required: 'yes'
    note: ''
  - key: Email__ResendApiKey
    required: only if the feature is used
    note: ''
  - key: Auth__External__StateKey
    required: only if the feature is used
    note: ''
  - key: Auth__External__Google__ClientId
    required: only if the feature is used
    note: ''
  - key: Auth__External__Google__ClientSecret
    required: only if the feature is used
    note: ''
  - key: Auth__External__Microsoft__ClientId
    required: only if the feature is used
    note: ''
  - key: Auth__External__Microsoft__ClientSecret
    required: only if the feature is used
    note: ''
- name: kuasar-identity-migrate
  keys:
